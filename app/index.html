<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centinela</title>
<meta name="description" content="Monitoreo de unidades, alertas e incidentes.">
<meta name="theme-color" content="#ddd3c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Centinela">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <main class="view" id="view" aria-live="polite"></main>
  <div class="scrim" data-a="close"></div>
  <nav class="drawer" id="drawer" aria-label="Menú principal"></nav>
  <div class="sheet-scrim" data-a="sheetclose"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Confirmación"><div class="grab"></div><div class="sheet-c"></div><button class="cancel" data-a="sheetclose">Cancelar</button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<noscript>Centinela necesita JavaScript para funcionar.</noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
